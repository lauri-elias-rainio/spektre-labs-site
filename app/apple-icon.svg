<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect width="180" height="180" fill="#000000"/>
  <!-- outer ring -->
  <circle cx="90" cy="90" r="78" fill="none" stroke="#888d97" stroke-width="1.5"/>
  <!-- mid ring -->
  <circle cx="90" cy="90" r="60" fill="none" stroke="#e8eaee" stroke-width="1"/>
  <!-- inner ring -->
  <circle cx="90" cy="90" r="40" fill="none" stroke="#888d97" stroke-width="1"/>
  <!-- cardinal nodes N E S W -->
  <circle cx="90"  cy="12"  r="5" fill="#e8eaee"/>
  <circle cx="168" cy="90"  r="5" fill="#e8eaee"/>
  <circle cx="90"  cy="168" r="5" fill="#e8eaee"/>
  <circle cx="12"  cy="90"  r="5" fill="#e8eaee"/>
  <!-- cardinal tick marks (outer→mid) -->
  <line x1="90"  y1="30"  x2="90"  y2="50"  stroke="#888d97" stroke-width="1.5"/>
  <line x1="150" y1="90"  x2="130" y2="90"  stroke="#888d97" stroke-width="1.5"/>
  <line x1="90"  y1="150" x2="90"  y2="130" stroke="#888d97" stroke-width="1.5"/>
  <line x1="30"  y1="90"  x2="50"  y2="90"  stroke="#888d97" stroke-width="1.5"/>
  <!-- central diamond -->
  <polygon points="90,55 125,90 90,125 55,90" fill="none" stroke="#e8eaee" stroke-width="2"/>
  <!-- inner diamond fill -->
  <polygon points="90,72 108,90 90,108 72,90" fill="#e8eaee"/>
</svg>
