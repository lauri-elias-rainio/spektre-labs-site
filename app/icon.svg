<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#000000"/>
  <!-- outer ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#888d97" stroke-width="0.75"/>
  <!-- mid ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#e8eaee" stroke-width="0.5"/>
  <!-- inner ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#888d97" stroke-width="0.5"/>
  <!-- cardinal nodes N E S W -->
  <circle cx="32" cy="3"  r="2" fill="#e8eaee"/>
  <circle cx="61" cy="32" r="2" fill="#e8eaee"/>
  <circle cx="32" cy="61" r="2" fill="#e8eaee"/>
  <circle cx="3"  cy="32" r="2" fill="#e8eaee"/>
  <!-- cardinal tick marks (outer→mid) -->
  <line x1="32" y1="10" x2="32" y2="18" stroke="#888d97" stroke-width="0.75"/>
  <line x1="54" y1="32" x2="46" y2="32" stroke="#888d97" stroke-width="0.75"/>
  <line x1="32" y1="54" x2="32" y2="46" stroke="#888d97" stroke-width="0.75"/>
  <line x1="10" y1="32" x2="18" y2="32" stroke="#888d97" stroke-width="0.75"/>
  <!-- central diamond -->
  <polygon points="32,20 44,32 32,44 20,32" fill="none" stroke="#e8eaee" stroke-width="1"/>
  <!-- inner diamond fill -->
  <polygon points="32,26 38,32 32,38 26,32" fill="#e8eaee"/>
</svg>
